      - name: Chuan hoa lenh build (add-data ; hay :) va ghi ra file
        run: |
          python3 convert_sep.py "$INPUT_BUILD_COMMAND" unix > build_cmd.sh
          echo "Lenh se chay:"
          cat build_cmd.sh
      - name: Chay lenh build
        run: bash build_cmd.sh
      - name: Double check ket qua build
        run: |
          for i in 1 2; do
            echo "=== Lan kiem tra $i ==="
            if compgen -G "dist/*" > /dev/null 2>&1 || compgen -G "*.bin" > /dev/null 2>&1 || compgen -G "*.app" > /dev/null 2>&1; then
              echo "OK: tim thay file build."
            else
              echo "CANH BAO: khong tim thay file build o lan kiem tra $i, kiem tra ky lai log ben tren."
