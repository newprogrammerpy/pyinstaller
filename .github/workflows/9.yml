      - name: Nang cap pip va certifi
        run: |
          python3 -m pip install --upgrade pip certifi 
      - name: Ghi script tu dong phat hien import
        run: echo  | base64 -d > auto_install.py
      - name: Ghi script chuan hoa dau add-data
        run: echo  | base64 -d > convert_sep.py
      - name: Cai dat cong cu build
        run: |
          if [ "$INPUT_TOOL" = "1" ]; then pip install nuitka ; else pip install pyinstaller ; fi
      - name: Tu dong cai thu vien con thieu (hidden imports)
