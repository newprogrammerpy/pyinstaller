name: Build Multi-Platform

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Chọn công cụ build (1 = Nuitka, 2 = PyInstaller)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "2"
      entry_file:
        description: "Ten file .py chinh (entry point), vd: main.py hoac heck.py"
        required: true
        type: string
        default: "main.py"
      build_command:
        description: "Câu lệnh build. Dau add-data (; hay :) se tu duoc chuan hoa theo tung OS, vd: pyinstaller --onefile --add-data \"heck.py;.\" heck.py"
        required: true
        type: string
      python_version:
        description: "Phien ban Python (vd: 3.13 = ban 3.13.x moi nhat, 3.13.12 = dung ban do)"
        required: true
        type: string
        default: "3.12.10"

jobs:
  # ================= WINDOWS =================

  build-windows-2022-64:
    runs-on: windows-2022
    env:
      INPUT_TOOL: ${{ inputs.tool }}
      INPUT_ENTRY_FILE: ${{ inputs.entry_file }}
      INPUT_BUILD_COMMAND: ${{ inputs.build_command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ inputs.python_version }}', architecture: 'x64' }
      - name: Tao virtual environment (venv)
        run: |
          python -m venv .venv
          echo "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Nang cap pip va certifi
        run: |
          python -m pip install --upgrade pip certifi
      - name: Ghi script tu dong phat hien import
        run: |
          $bytes = [Convert]::FromBase64String("")
          [IO.File]::WriteAllText("auto_install.py", [Text.Encoding]::UTF8.GetString($bytes))
      - name: Ghi script chuan hoa dau add-data
        run: |
          $bytes = [Convert]::FromBase64String("")
          [IO.File]::WriteAllText("convert_sep.py", [Text.Encoding]::UTF8.GetString($bytes))
      - name: Cai dat cong cu build
        run: |
          if ($env:INPUT_TOOL -eq "1") { pip install nuitka } else { pip install pyinstaller }
      - name: Tu dong cai thu vien con thieu (hidden imports)
        run: python auto_install.py "$env:INPUT_ENTRY_FILE"
      - name: Chuan hoa lenh build (add-data ; hay :) va ghi ra file
        run: |
          python convert_sep.py "$env:INPUT_BUILD_COMMAND" win | Out-File -FilePath build_cmd.ps1 -Encoding utf8
          Write-Host "Lenh se chay:"
          Get-Content build_cmd.ps1
      - name: Chay lenh build
        run: powershell -ExecutionPolicy Bypass -File .\build_cmd.ps1
      - name: Double check ket qua build
        run: |
          for ($i=1; $i -le 2; $i++) {
            Write-Host "=== Lan kiem tra $i ==="
            $found = (Get-ChildItem -Path dist -ErrorAction SilentlyContinue) -or (Get-ChildItem -Filter *.exe -ErrorAction SilentlyContinue)
            if ($found) { Write-Host "OK: tim thay file build." } else { Write-Host "CANH BAO: khong tim thay file build o lan kiem tra $i." }
          }
      - uses: actions/upload-artifact@v4
        with: { name: app-windows-2022-amd64, path: "dist/*\n*.exe" }

